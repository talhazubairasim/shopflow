name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: .NET services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore ShopFlow.sln
      - run: dotnet build ShopFlow.sln --no-restore -c Release
      - run: dotnet test ShopFlow.sln --no-build -c Release --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"

  web:
    name: React storefront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Web/package-lock.json
      - run: npm ci
      - run: npm run coverage
      - run: npm run build

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: ./scripts/e2e.sh
      - name: Storefront is served
        run: curl -fs http://localhost:3000 | grep -q '<div id="root">'
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
