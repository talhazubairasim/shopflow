apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, labels: { app: gateway } }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/talhazubairasim/shopflow-gateway:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: Urls, value: "http://+:8080" }
            - { name: Cors__Origins__0, value: "https://shop.example.com" }
            - { name: ReverseProxy__Clusters__catalog__Destinations__d1__Address, value: "http://catalog:8080" }
            - { name: ReverseProxy__Clusters__basket__Destinations__d1__Address, value: "http://basket:8080" }
            - { name: ReverseProxy__Clusters__ordering__Destinations__d1__Address, value: "http://ordering:8080" }
            - { name: ReverseProxy__Clusters__payment__Destinations__d1__Address, value: "http://payment:8080" }
            - { name: ReverseProxy__Clusters__identity__Destinations__d1__Address, value: "http://identity:8080" }
            - { name: ReverseProxy__Clusters__notification__Destinations__d1__Address, value: "http://notification:8080" }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  selector: { app: gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, labels: { app: web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: ghcr.io/talhazubairasim/shopflow-web:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: shopflow }
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: gateway, port: { number: 8080 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
