# The six microservices. Images are built by CI from the root Dockerfile.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog, labels: { app: catalog } }
spec:
  replicas: 2
  selector: { matchLabels: { app: catalog } }
  template:
    metadata: { labels: { app: catalog } }
    spec:
      containers:
        - name: catalog
          image: ghcr.io/talhazubairasim/shopflow-catalog:latest
          ports: [{ containerPort: 8080 }]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: shopflow-secrets, key: postgres-password } }
            - name: Jwt__Key
              valueFrom: { secretKeyRef: { name: shopflow-secrets, key: jwt-key } }
            - name: RabbitMq__Password
              valueFrom: { secretKeyRef: { name: shopflow-secrets, key: rabbitmq-password } }
            - { name: Urls, value: "http://+:8080" }
            - { name: RabbitMq__Host, value: "rabbitmq" }
            - { name: RabbitMq__Username, value: "shopflow" }
            - { name: ConnectionStrings__Catalog, value: "Host=postgres;Database=catalog;Username=shopflow;Password=$(POSTGRES_PASSWORD)" }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 8080 }, periodSeconds: 20 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata: { name: catalog }
spec:
  selector: { app: catalog }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
