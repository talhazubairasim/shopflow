            - { name: Urls, value: "http://+:8080" }
            - { name: RabbitMq__Host, value: "rabbitmq" }
            - { name: RabbitMq__Username, value: "shopflow" }
            - { name: ConnectionStrings__Redis, value: "redis:6379" }
            - { name: Services__Catalog, value: "http://catalog:8080" }
